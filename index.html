<script>
(function(){
  const STORAGE_KEY = 'inventory-list';
  const ACTIVITY_KEY = 'activity-log';
  let SEED_DATA = [];
  try {
    SEED_DATA = JSON.parse(document.getElementById('seed-data').textContent);
  } catch(e) { SEED_DATA = []; }

  const CATEGORY_ORDER = ["PHYTOMap","Arabidopsis nuclei prep","MERFISH","Bacteria infection","csRNASeq","GoldenGate/cloning","Restriction enzymes","MPRA","General","Protein purification / protein works","Histone work","ChIP-Seq","Genotyping","RNase depletion","Microbiome transcriptome","Equipment"];
  function categoryRank(cat){
    const i = CATEGORY_ORDER.indexOf(cat || 'General');
    return i === -1 ? CATEGORY_ORDER.length : i;
  }

  let state = {
    loaded: false,
    storageMode: 'unknown', // 'sheets' | 'local-only' | 'error'
    view: 'lab', // 'lab' | 'admin'
    inventory: [],
    activity: [],
    search: '',
    category: 'All',
    sortCol: 'original',
    sortDir: 'asc',
    expandedId: null,
    expandedCategories: new Set(), // lab view: which category groups are open
    editingId: null, // admin form editing existing record
    newOrderOpenId: null, // admin: row whose "record new order" mini-form is open
    historyOpenId: null, // admin: row whose order-history editor is open
    adminUnlocked: false,
    passcodeError: false,
    lastBulkAddIds: [],
    adminSearch: '',
    toast: null,
  };

  const app = document.getElementById('app');

  // ---------- helpers ----------
  function esc(s){
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function looksDatey(s){
    if (!s || typeof s !== 'string') return false;
    return /\d{1,4}[\/-]\d{1,2}[\/-]\d{1,4}/.test(s);
  }
  function fmtDate(iso){
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  }
  function lastHist(rec){
    return (rec.history && rec.history.length) ? rec.history[rec.history.length-1] : null;
  }
  function isAwaiting(rec){
    const h = lastHist(rec);
    if (!h) return false;
    const hasOrdered = !!(h.ordered_date || looksDatey(h.ordered_raw));
    const hasReceived = !!(h.received_date || h.received_raw);
    return hasOrdered && !hasReceived;
  }
  function mostRecentReceived(rec){
    const dates = (rec.history||[]).map(h=>h.received_date).filter(Boolean);
    if (!dates.length) return null;
    return dates.slice().sort().slice(-1)[0];
  }
  function lastOrderedDisplay(rec){
    const h = lastHist(rec);
    if (!h) return '';
    const base = h.ordered_date ? fmtDate(h.ordered_date) : (h.ordered_raw || '');
    return h.qty ? (base + ' · ' + h.qty) : base;
  }
  function lastOrderedSortKey(rec){
    const h = lastHist(rec);
    if (!h) return '';
    return h.ordered_date || '';
  }
  function daysWaiting(rec){
    const h = lastHist(rec);
    if (!h || !h.ordered_date) return null;
    const ms = Date.now() - new Date(h.ordered_date+'T00:00:00').getTime();
    return Math.max(0, Math.floor(ms / 86400000));
  }
  const STORAGE_COLORS = {};
  const PALETTE = ['#2c6e6b','#b8791f','#6b5b95','#8a3b3b','#3f6f4a','#4a5b8f','#a15c3e','#5f7a3d'];
  function colorForStorage(s){
    const key = (s||'unspecified').toLowerCase();
    if (STORAGE_COLORS[key]) return STORAGE_COLORS[key];
    let h = 0;
    for (let i=0;i<key.length;i++) h = (h*31 + key.charCodeAt(i)) >>> 0;
    const c = PALETTE[h % PALETTE.length];
    STORAGE_COLORS[key] = c;
    return c;
  }
  function nextId(){
    return state.inventory.reduce((m,r)=>Math.max(m, r.id||0), 0) + 1;
  }
  function logActivity(text){
    state.activity.unshift({ ts: new Date().toISOString(), text });
    state.activity = state.activity.slice(0, 30);
  }
  function showToast(msg){
    state.toast = msg;
    render();
    setTimeout(()=>{ state.toast = null; const t = app.querySelector('.la-toast'); if (t) t.classList.remove('show'); }, 2600);
  }

  // ---------- storage (Google Sheets via Apps Script web app) ----------
  // 1. Make a Google Sheet with a tab named "Data" (see setup guide provided alongside this file).
  // 2. Deploy the paired Apps Script as a Web App and paste its /exec URL below.
  const SHEETS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzXsl_aU93sG62dBzvwzkW7Dn-8f9hO_D6Xrcf6musIPEKdTQyZAimJrZoSzOcSn0o/exec';

  // Simple passcode gate for the Admin tab. This is a light deterrent for a
  // shared lab link, NOT real security — anyone who views this file's source
  // can read the passcode below. Change it to whatever your lab wants.
  const ADMIN_PASSCODE = 'labadmin';

  function sheetsConfigured(){
    return SHEETS_WEBAPP_URL && SHEETS_WEBAPP_URL.indexOf('PASTE_YOUR') === -1 && SHEETS_WEBAPP_URL.indexOf('http') === 0;
  }
  async function sheetsGet(key){
    const res = await fetch(SHEETS_WEBAPP_URL + '?key=' + encodeURIComponent(key));
    if (!res.ok) throw new Error('Sheet read failed (' + res.status + ')');
    const data = await res.json();
    return (data && data.value !== undefined && data.value !== null) ? data : null;
  }
  async function sheetsSet(key, value){
    // text/plain avoids a CORS preflight that Apps Script web apps don't handle
    const res = await fetch(SHEETS_WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key, value })
    });
    if (!res.ok) throw new Error('Sheet write failed (' + res.status + ')');
    const data = await res.json();
    if (!data || data.ok !== true) {
      throw new Error('Sheet write failed: ' + (data && data.error ? data.error : 'unknown error'));
    }
    return data;
  }

  async function loadData(){
    if (!sheetsConfigured()) {
      // Not hooked up to a Google Sheet yet — run on the built-in seed data only.
      // Nothing will be saved between visits until SHEETS_WEBAPP_URL is set above.
      state.inventory = JSON.parse(JSON.stringify(SEED_DATA));
      state.activity = [];
      state.storageMode = 'local-only';
      finishMigrationsAndRender();
      return;
    }
    try {
      const res = await sheetsGet(STORAGE_KEY);
      state.inventory = res ? JSON.parse(res.value) : null;
      if (!state.inventory) {
        // first run: seed the sheet
        state.inventory = JSON.parse(JSON.stringify(SEED_DATA));
        await sheetsSet(STORAGE_KEY, JSON.stringify(state.inventory));
      }
      const a = await sheetsGet(ACTIVITY_KEY);
      state.activity = a ? JSON.parse(a.value) : [];
      state.storageMode = 'sheets';
    } catch(e) {
      console.error('Google Sheets connection failed', e);
      state.inventory = JSON.parse(JSON.stringify(SEED_DATA));
      state.activity = [];
      state.storageMode = 'error';
    }
    finishMigrationsAndRender();
  }

  async function finishMigrationsAndRender(){
    // one-time fix: earlier seed data mislabeled the PHYTOMAP section as "General"
    // (a category header row was skipped during import). Correct already-saved
    // data using the corrected seed as the source of truth, matched by row id.
    const correctCatById = {};
    SEED_DATA.forEach(r => { correctCatById[r.id] = r.category; });
    let migrated = false;
    state.inventory.forEach(r => {
      const correct = correctCatById[r.id];
      if (correct && r.category !== correct) {
        r.category = correct;
        migrated = true;
      }
    });
    if (migrated) {
      logActivity('System: corrected mislabeled categories (PHYTOMAP items were showing as General)');
      if (state.storageMode === 'sheets') await persist();
    }

    // small follow-up fix: category name spelling PHYTOMAP -> PHYTOMap
    let renamed = false;
    state.inventory.forEach(r => {
      if (r.category === 'PHYTOMAP') { r.category = 'PHYTOMap'; renamed = true; }
    });
    if (renamed && state.storageMode === 'sheets') {
      await persist();
    }
    state.loaded = true;
    render();
  }

  async function persist(){
    if (state.storageMode !== 'sheets') {
      showToast('⚠ Not connected to Google Sheets — this change won\'t be saved');
      return;
    }
    try {
      await sheetsSet(STORAGE_KEY, JSON.stringify(state.inventory));
      await sheetsSet(ACTIVITY_KEY, JSON.stringify(state.activity));
    } catch(e) {
      console.error('storage save failed', e);
      showToast('⚠ Could not save — check your connection and try again');
    }
  }

  // ---------- actions (exposed on window) ----------
  window.laSetView = function(v){ state.view = v; state.expandedId = null; state.passcodeError = false; render(); };
  window.laSubmitPasscode = function(ev){
    if (ev && ev.preventDefault) ev.preventDefault();
    const input = document.getElementById('la-passcode-input');
    const entered = input ? input.value.trim() : '';
    if (entered && entered === ADMIN_PASSCODE) {
      state.adminUnlocked = true;
      state.passcodeError = false;
    } else {
      state.passcodeError = true;
    }
    render();
    if (state.passcodeError) {
      const el = document.getElementById('la-passcode-input');
      if (el) el.focus();
    }
  };
  window.laToggleExpand = function(id){
    state.expandedId = (state.expandedId === id) ? null : id;
    render();
  };
  window.laSetSearch = function(v){ state.search = v; render(); };
  window.laRunSearch = function(){
    const el = document.getElementById('la-search-input');
    laSetSearch(el ? el.value : '');
  };
  window.laSetCategory = function(v){ state.category = v; render(); };
  window.laSetAdminSearch = function(v){ state.adminSearch = v; render(); };
  window.laRunAdminSearch = function(){
    const el = document.getElementById('la-admin-search-input');
    laSetAdminSearch(el ? el.value : '');
  };
  window.laToggleCategoryGroup = function(cat){
    if (state.expandedCategories.has(cat)) state.expandedCategories.delete(cat);
    else state.expandedCategories.add(cat);
    render();
  };
  window.laExpandAllCategories = function(){
    state.expandedCategories = new Set(getCategories().filter(c => c !== 'All'));
    render();
  };
  window.laCollapseAllCategories = function(){
    state.expandedCategories = new Set();
    render();
  };
  window.laSort = function(col){
    if (state.sortCol === col) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    else { state.sortCol = col; state.sortDir = 'asc'; }
    render();
  };
  window.laToggleHistory = function(id){
    state.historyOpenId = (state.historyOpenId === id) ? null : id;
    state.newOrderOpenId = null;
    render();
  };

  window.laDeleteHistoryEntry = async function(id, idx){
    const rec = state.inventory.find(r => r.id === id);
    if (!rec || !rec.history || !rec.history[idx]) return;
    const h = rec.history[idx];
    const label = h.ordered_date ? fmtDate(h.ordered_date) : (h.ordered_raw || 'this entry');
    if (!confirm('Remove the order dated ' + label + '? This cannot be undone.')) return;
    rec.history.splice(idx, 1);
    logActivity('Removed an order entry (' + label + ') — ' + (rec.description || rec.index));
    await persist();
    showToast('Order entry removed');
    render();
  };

  window.laSaveHistoryEntry = async function(id, idx){
    const rec = state.inventory.find(r => r.id === id);
    if (!rec || !rec.history || !rec.history[idx]) return;
    const orderedInput = document.getElementById('la-hist-ordered-' + id + '-' + idx);
    const qtyInput = document.getElementById('la-hist-qty-' + id + '-' + idx);
    const receivedInput = document.getElementById('la-hist-received-' + id + '-' + idx);
    const h = rec.history[idx];
    const orderedDate = orderedInput ? orderedInput.value : '';
    const qty = qtyInput ? qtyInput.value.trim() : '';
    const receivedDate = receivedInput ? receivedInput.value : '';
    if (orderedDate) {
      h.ordered_date = orderedDate;
      h.ordered_raw = qty ? (orderedDate + ' (' + qty + ')') : orderedDate;
    }
    h.qty = qty || null;
    if (receivedDate) {
      h.received_date = receivedDate;
      h.received_raw = receivedDate;
    } else {
      h.received_date = null;
      h.received_raw = null;
    }
    logActivity('Edited an order entry — ' + (rec.description || rec.index));
    await persist();
    showToast('Order entry updated');
    render();
  };

  window.laStartEdit = function(id){
    state.editingId = id;
    state.view = 'admin';
    render();
    const form = document.getElementById('la-add-form');
    if (form) form.scrollIntoView({ behavior:'smooth', block:'start' });
  };
  window.laCancelEdit = function(){ state.editingId = null; render(); };

  // Proper quote-aware delimited-text parser: handles fields wrapped in
  // "double quotes" that contain the delimiter, commas, or even embedded
  // newlines (standard Excel "Save as tab-delimited text" behavior), so a
  // multi-line note doesn't get sliced into bogus extra rows.
  function parseDelimitedRows(text, delim){
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    let i = 0;
    const n = text.length;
    while (i < n) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i+1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"' && field === '') { inQuotes = true; i++; continue; }
      if (c === delim) { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { if (text[i+1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++;
    }
    if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
    return rows.filter(r => !(r.length === 1 && r[0].trim() === ''));
  }

  const BULK_HEADER_ALIASES = {
    'id':'index', 'index':'index',
    'category':'category',
    'name':'description', 'description':'description', 'item':'description', 'item name':'description',
    'manufacturer':'manufacturer', 'brand':'manufacturer', 'make':'manufacturer',
    'ordering name':'ordering_name',
    'supplier':'supplier', 'vendor':'supplier', 'retailer':'supplier',
    'supplier cat no':'supplier_cat_no', 'supplier cat. no.':'supplier_cat_no', 'supplier catalogue no':'supplier_cat_no', 'supplier catalog no':'supplier_cat_no',
    'catalogue no':'catalog_no', 'catalog no':'catalog_no', 'cat no':'catalog_no', 'cat. no.':'catalog_no', 'catalogue number':'catalog_no', 'catalog number':'catalog_no', 'catalogue no.':'catalog_no',
    'stores':'stores_external', 'stores/external':'stores_external', 'stores external':'stores_external', 'external':'stores_external',
    'unit':'unit_size', 'size':'unit_size', 'unit size':'unit_size', 'unit/size':'unit_size', 'pack size':'unit_size',
    'price':'price',
    'storage':'storage', 'storage location':'storage',
    'date ordered':'order_date', 'order date':'order_date', 'ordered':'order_date',
    'date received':'received_date', 'received date':'received_date', 'received':'received_date', 'date arrived':'received_date',
    'notes':'note', 'note':'note', 'comment':'note', 'comments':'note'
  };
  const BULK_DEFAULT_POSITIONS = { index:0, category:1, description:2, manufacturer:3, ordering_name:4, supplier:5, supplier_cat_no:6, catalog_no:7, stores_external:8, unit_size:9, price:10, storage:11, order_date:12, received_date:13, note:14 };

  function detectBulkHeaderMapping(firstRowCols){
    const mapping = {}; let matches = 0;
    firstRowCols.forEach((h, i) => {
      const key = BULK_HEADER_ALIASES[String(h).trim().toLowerCase().replace(/\s+/g,' ')];
      if (key) { mapping[key] = i; matches++; }
    });
    return matches >= 2 ? mapping : null;
  }

  window.laBulkAdd = async function(){
    const ta = document.getElementById('la-bulk-textarea');
    if (!ta || !ta.value.trim()) { showToast('Paste some rows first'); return; }
    const delim = ta.value.includes('\t') ? '\t' : ',';
    const allRows = parseDelimitedRows(ta.value, delim);
    if (allRows.length === 0) { showToast('Nothing recognizable to add'); return; }

    const headerMapping = detectBulkHeaderMapping(allRows[0]);
    const fieldMap = headerMapping || BULK_DEFAULT_POSITIONS;
    const dataRows = headerMapping ? allRows.slice(1) : allRows;
    const get = (cols, key) => {
      const i = fieldMap[key];
      return (i !== undefined && cols[i] !== undefined) ? String(cols[i]).trim() : '';
    };

    let nextAutoIndex = parseInt(suggestedNextIndex(), 10);
    let added = 0, skipped = 0;
    const addedIds = [];
    dataRows.forEach(cols => {
      const idxRaw       = get(cols, 'index');
      const category     = get(cols, 'category');
      const description  = get(cols, 'description');
      const manufacturer = get(cols, 'manufacturer');
      const orderingName = get(cols, 'ordering_name');
      const supplier      = get(cols, 'supplier');
      const supplierCatNo = get(cols, 'supplier_cat_no');
      const catalogNo     = get(cols, 'catalog_no');
      const storesExt     = get(cols, 'stores_external');
      const unitSize       = get(cols, 'unit_size');
      const price           = get(cols, 'price');
      const storage          = get(cols, 'storage');
      const orderDate         = get(cols, 'order_date');
      const receivedDate       = get(cols, 'received_date');
      const note                = get(cols, 'note');
      if (!description) { skipped++; return; }
      let idx = idxRaw;
      if (!idx) { idx = String(nextAutoIndex); nextAutoIndex++; }
      const newId = nextId();
      const history = [];
      if (orderDate) {
        history.push({ ordered_raw: orderDate, ordered_date: orderDate, received_raw: receivedDate || null, received_date: receivedDate || null });
      }
      state.inventory.push({
        id: newId,
        index: idx,
        catalog_no: catalogNo,
        description: description,
        manufacturer: manufacturer,
        ordering_name: orderingName || description,
        supplier: supplier,
        supplier_cat_no: supplierCatNo,
        stores_external: storesExt,
        unit_size: unitSize,
        price: price,
        note: note,
        storage: storage,
        category: category || 'General',
        history: history
      });
      addedIds.push(newId);
      added++;
    });
    if (added > 0) {
      state.lastBulkAddIds = addedIds;
      logActivity('Bulk added ' + added + ' new entr' + (added === 1 ? 'y' : 'ies') + (headerMapping ? ' (header-matched columns)' : ''));
      await persist();
    }
    ta.value = '';
    showToast(added + ' entr' + (added === 1 ? 'y' : 'ies') + ' added' + (skipped ? ', ' + skipped + ' skipped (no name)' : '') + (headerMapping ? ' — matched by your header row' : ''));
    render();
  };

  window.laUndoBulkAdd = async function(){
    if (!state.lastBulkAddIds || state.lastBulkAddIds.length === 0) {
      showToast('Nothing to undo');
      return;
    }
    const ids = state.lastBulkAddIds;
    state.inventory = state.inventory.filter(r => !ids.includes(r.id));
    logActivity('Undid bulk add of ' + ids.length + ' entr' + (ids.length === 1 ? 'y' : 'ies'));
    state.lastBulkAddIds = [];
    await persist();
    showToast('Removed the ' + ids.length + ' entr' + (ids.length === 1 ? 'y' : 'ies') + ' from that bulk add');
    render();
  };

  window.laSubmitForm = async function(ev){
    ev.preventDefault();
    const f = ev.target;
    const get = name => f.elements[name] ? f.elements[name].value.trim() : '';
    const editing = state.editingId;
    let rec;
    if (editing) {
      rec = state.inventory.find(r => r.id === editing);
      if (!rec) { showToast('Entry not found'); return; }
    } else {
      rec = { id: nextId(), history: [] };
      state.inventory.push(rec);
    }
    rec.index = get('index');
    rec.description = get('description');
    rec.manufacturer = get('manufacturer');
    rec.ordering_name = get('ordering_name') || rec.description;
    rec.supplier = get('supplier');
    rec.catalog_no = get('catalog_no');
    rec.supplier_cat_no = get('supplier_cat_no');
    rec.stores_external = get('stores_external');
    rec.unit_size = get('unit_size');
    rec.price = get('price');
    rec.note = get('note');
    rec.storage = get('storage');
    rec.category = get('category') || 'General';

    const orderDate = get('order_date');
    if (!editing && orderDate) {
      rec.history.push({ ordered_raw: orderDate, ordered_date: orderDate, received_raw: null, received_date: null });
    }

    logActivity((editing ? 'Updated entry — ' : 'Added new entry — ') + (rec.description || rec.index || ('#'+rec.id)));
    await persist();
    state.editingId = null;
    f.reset();
    showToast(editing ? 'Entry updated' : 'Entry added');
    render();
  };

  window.laDeleteEntry = async function(id){
    const rec = state.inventory.find(r => r.id === id);
    if (!rec) return;
    if (!confirm('Delete "' + (rec.description || rec.index) + '" from the inventory? This cannot be undone.')) return;
    state.inventory = state.inventory.filter(r => r.id !== id);
    logActivity('Deleted entry — ' + (rec.description || rec.index));
    await persist();
    showToast('Entry deleted');
    render();
  };

  window.laMarkReceivedToday = async function(id){
    const rec = state.inventory.find(r => r.id === id);
    if (!rec) return;
    const h = lastHist(rec);
    if (!h) return;
    h.received_date = todayISO();
    h.received_raw = todayISO();
    logActivity('Marked received (today) — ' + (rec.description || rec.index));
    await persist();
    showToast('Marked received today');
    render();

    const input = document.getElementById('la-manual-date-' + id);
    if (!input || !input.value) { showToast('Pick a date first'); return; }
    const rec = state.inventory.find(r => r.id === id);
    if (!rec) return;
    const h = lastHist(rec);
    if (!h) return;
    h.received_date = input.value;
    h.received_raw = input.value;
    logActivity('Marked received (' + fmtDate(input.value) + ') — ' + (rec.description || rec.index));
    await persist();

  window.laToggleNewOrderForm = function(id){
    const rec = state.inventory.find(r => r.id === id);
    if (rec) {
      const h = lastHist(rec);
      if (h && !h.received_date && !h.received_raw) {
        showToast('This item already has an order awaiting arrival');
        return;
      }
    }
    state.newOrderOpenId = (state.newOrderOpenId === id) ? null : id;
    state.historyOpenId = null;
    render();

  window.laConfirmNewOrder = async function(id){
    const dateInput = document.getElementById('la-neworder-date-' + id);
    const qtyInput = document.getElementById('la-neworder-qty-' + id);
    const date = (dateInput && dateInput.value) ? dateInput.value : todayISO();
    const qty = qtyInput ? qtyInput.value.trim() : '';
    const rec = state.inventory.find(r => r.id === id);
    if (!rec) return;
    if (!rec.history) rec.history = [];
    const h = lastHist(rec);
    if (h && !h.received_date && !h.received_raw) {
      showToast('This item already has an order awaiting arrival');
      state.newOrderOpenId = null;
      render();
      return;
    }
    const orderedRaw = qty ? (date + ' (' + qty + ')') : date;
    rec.history.push({ ordered_raw: orderedRaw, ordered_date: date, received_raw: null, received_date: null, qty: qty || null });
    logActivity('New order placed (' + fmtDate(date) + (qty ? ', ' + qty : '') + ') — ' + (rec.description || rec.index));
    await persist();
    state.newOrderOpenId = null;
    showToast('New order recorded — added to waiting list');
    render();
  };

  // ---------- derived data ----------
  function getCategories(){
    const set = new Set(state.inventory.map(r => r.category || 'General'));
    return ['All', ...Array.from(set).sort()];
  }
  function filteredSorted(){
    const q = state.search.trim().toLowerCase();
    let list = state.inventory.filter(r => {
      if (state.category !== 'All' && (r.category||'General') !== state.category) return false;
      if (!q) return true;
      const hay = [r.description, r.manufacturer, r.ordering_name, r.catalog_no, r.supplier_cat_no, r.index, r.storage]
        .map(x => (x||'').toString().toLowerCase()).join(' ');
      return hay.includes(q);
    });
    const col = state.sortCol, dir = state.sortDir === 'asc' ? 1 : -1;
    list.sort((a,b) => {
      if (col === 'original') return (a.id - b.id) * dir;
      let av, bv;
      if (col === 'index') { av = a.index||''; bv = b.index||''; }
      else if (col === 'description') { av = a.description||''; bv = b.description||''; }
      else if (col === 'manufacturer') { av = a.manufacturer||''; bv = b.manufacturer||''; }
      else if (col === 'storage') { av = a.storage||''; bv = b.storage||''; }
      else if (col === 'received') { av = mostRecentReceived(a)||''; bv = mostRecentReceived(b)||''; }
      else { av = ''; bv = ''; }
      av = av.toString().toLowerCase(); bv = bv.toString().toLowerCase();
      if (av < bv) return -1*dir;
      if (av > bv) return 1*dir;
      return 0;
    });
    return list;
  }
  function groupByCategory(list){
    const buckets = {};
    list.forEach(r => {
      const c = r.category || 'General';
      if (!buckets[c]) buckets[c] = [];
      buckets[c].push(r);
    });
    const known = CATEGORY_ORDER.filter(c => buckets[c]);
    const unknown = Object.keys(buckets).filter(c => !CATEGORY_ORDER.includes(c)).sort();
    return [...known, ...unknown].map(cat => ({ category: cat, items: buckets[cat] }));
  }
  function categoryIsExpanded(cat){
    if (state.category !== 'All') return true; // already filtered down to one category
    if (state.search.trim()) return true; // auto-open groups while searching
    return state.expandedCategories.has(cat);
  }
  function awaitingList(){
    return state.inventory.filter(isAwaiting).sort((a,b) => lastOrderedSortKey(a).localeCompare(lastOrderedSortKey(b)));
  }

                  <td colspan="3" style="background:#fafafa;">
                    ${ (!r.history || r.history.length === 0)
                        ? `<div class="la-empty-note" style="padding:8px 2px;">No orders recorded for this entry yet.</div>`
                        : `<div class="la-hist-edit-list">
                            ${r.history.map((h, idx) => {
                              const isPending = !h.received_date && !h.received_raw;
                              if (isPending) {
                                return `
                              <div class="la-hist-edit-row la-hist-pending-row">
                                <div class="la-form-field">
                                  <label>Ordered <span class="la-pending-tag">awaiting</span></label>
                                  <input type="date" id="la-hist-ordered-${r.id}-${idx}" value="${h.ordered_date ? esc(h.ordered_date) : ''}" max="${todayISO()}" />
                                  ${ !h.ordered_date && h.ordered_raw ? `<div class="la-hist-raw-note">was: ${esc(h.ordered_raw)}</div>` : '' }
                                </div>
                                <div class="la-form-field">
                                  <label>Qty / portions</label>
                                  <input type="text" id="la-hist-qty-${r.id}-${idx}" value="${esc(h.qty||'')}" placeholder="e.g. 2 tubes" />
                                </div>
                                <div class="la-form-field">
                                  <label>Received</label>
                                  <input type="date" id="la-hist-received-${r.id}-${idx}" value="" max="${todayISO()}" />
                                </div>
                                <button class="la-btn secondary small" onclick="laSaveHistoryEntry(${r.id},${idx})">Save</button>
                                <button class="la-btn danger small" onclick="laDeleteHistoryEntry(${r.id},${idx})">Remove</button>
                              </div>`;
                              }
                              return `
                              <div class="la-hist-read-row">
                                <span class="la-hist-read-text">
                                  Ordered ${esc(h.ordered_date ? fmtDate(h.ordered_date) : (h.ordered_raw||'—'))}${h.qty? ' · '+esc(h.qty):''} — received ${esc(h.received_date ? fmtDate(h.received_date) : (h.received_raw||'—'))}
                                </span>
                                <button class="la-btn danger small" onclick="laDeleteHistoryEntry(${r.id},${idx})">Remove</button>
                              </div>`;
                            }).join('')}
                          </div>`
                    }
                  </td>
                </tr>
                ` : '' }
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderActivity(){
    return `
      <div class="la-panel-box">
        <h3>Recent activity</h3>
        ${ state.activity.length === 0
            ? `<div class="la-empty-note">No changes logged yet.</div>`
            : `<ul class="la-activity-list">
                ${state.activity.slice(0,12).map(a => `
                  <li><span>${esc(a.text)}</span><span class="la-activity-ts">${new Date(a.ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span></li>
                `).join('')}
              </ul>`
        }
      </div>
    `;
  }

  function renderBulkAddForm(){
    return `
      <div class="la-panel-box">
        <h3>Bulk add entries</h3>
        <p class="la-bulk-instructions">Paste multiple rows at once — e.g. copy straight from Excel (tab-separated), or use commas. One item per line.</p>
        <p class="la-bulk-instructions"><strong>Easiest way:</strong> add a header row as the first line naming your columns (any order, any subset) — recognized names: ID, Category, Name, Manufacturer, Ordering name, Supplier, Supplier cat no, Catalogue no, Stores/external, Unit/Size, Price, Storage, Date ordered, Date received, Notes. The app matches by name, so your spreadsheet's own column order is fine.</p>
        <p class="la-bulk-instructions">Without a header row, columns are read in this fixed order instead:</p>
        <p class="la-bulk-columns">ID · Category · Name · Manufacturer · Ordering name · Supplier · Supplier cat. no. · Catalogue no. · Stores/external · Unit/Size · Price · Storage · Date ordered (YYYY-MM-DD) · Date received (YYYY-MM-DD) · Notes</p>
        <p class="la-bulk-instructions">Only <strong>Name</strong> is required — leave any other column blank if you don't know it. Leave ID blank to auto-number it.</p>
        <textarea id="la-bulk-textarea" rows="6" placeholder="310&#9;Equipment&#9;New microscope slide box&#9;VWR&#9;&#9;&#9;&#9;&#9;&#9;45.00&#9;&#9;&#9;Arrived, needs a shelf spot"></textarea>
        <div class="la-form-actions">
          <button class="la-btn" onclick="laBulkAdd()">Add all rows</button>
          ${ state.lastBulkAddIds && state.lastBulkAddIds.length ? `<button class="la-btn danger" onclick="laUndoBulkAdd()">Undo last bulk add (${state.lastBulkAddIds.length})</button>` : '' }
        </div>
      </div>
    `;
  }

  function renderAdminView(){
    return `
      <div class="la-admin-stack">
        ${renderWaitingAdmin()}
        ${renderAddForm()}
        ${renderBulkAddForm()}
        ${renderAdminTable()}
        ${renderActivity()}
      </div>
    `;
  }

  function renderPasscodeGate(){
    return `
      <div class="la-passcode-gate">
        <h3>Admin access</h3>
        <p>Enter the lab's admin passcode to add entries, register arrivals, or make edits.</p>
        <input type="password" id="la-passcode-input" placeholder="Passcode"
          onkeydown="if(event.key==='Enter'){laSubmitPasscode();}" />
        ${ state.passcodeError ? `<div class="la-passcode-error">Incorrect passcode — try again.</div>` : '' }
        <button type="button" class="la-btn" onclick="laSubmitPasscode()">Unlock admin</button>
      </div>
    `;
  }

  // ---------- root render ----------
  function renderConnectionBanner(){
    if (state.storageMode === 'sheets') return '';
    const msg = state.storageMode === 'local-only'
      ? 'Not connected to a Google Sheet yet — you\'re viewing the built-in sample data and nothing will be saved. Set SHEETS_WEBAPP_URL near the top of the script to connect it.'
      : 'Could not reach the Google Sheet — showing local data only. Changes won\'t be saved until the connection is restored.';
    return `<div class="la-connection-banner">${esc(msg)}</div>`;
  }

  function render(){
    if (!state.loaded) {
      app.innerHTML = renderHeader() + `<div class="la-loading">Loading inventory…</div>`;
      return;
    }
    let body;
    if (state.view === 'lab') {
      body = `<div class="la-main">${renderAwaitingPanel()}${renderControls()}${renderMainTable()}</div>`;
    } else if (!state.adminUnlocked) {
      body = `<div class="la-main">${renderPasscodeGate()}</div>`;
    } else {
      body = `<div class="la-main">${renderAdminView()}</div>`;
    }
    const footerNote = state.storageMode === 'sheets'
      ? 'Shared inventory — synced to Google Sheets, so changes made in Admin are visible to everyone.'
      : 'Running on local sample data only — connect a Google Sheet to make this live and shared.';
    app.innerHTML = renderHeader() + renderConnectionBanner() + body +
      `<div class="la-footer">
        <span class="copyright">© ${new Date().getFullYear()}</span>
        <p class="la-shared-note">${esc(footerNote)}</p>
      </div>` +
      (state.toast ? `<div class="la-toast show">${esc(state.toast)}</div>` : '');
  }

  loadData();
})();
</script>
